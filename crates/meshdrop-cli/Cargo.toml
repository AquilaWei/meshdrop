[package]
name = "meshdrop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
[lints]
workspace = true
[[bin]]
name = "meshdrop"
path = "src/main.rs"
[dependencies]
meshdrop-core = { path = "../meshdrop-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
[dev-dependencies]
tempfile = "3"
