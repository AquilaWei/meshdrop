name: release installers
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version and CHANGELOG section
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" == push ]]; then
            python3 scripts/packaging/release.py metadata --tag "$TAG"
          else
            python3 scripts/packaging/release.py metadata
          fi
      - name: Packaging helper tests
        run: python3 -m unittest discover -s scripts/packaging -p 'test_*.py' -v

  linux:
    needs: [ci, metadata]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install build and launch dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm cpio xvfb x11-utils dbus-x11
      - run: cargo install tauri-cli --locked --version 2.11.4
      - name: Build x86_64 RPM only
        working-directory: crates/meshdrop-app
        run: cargo tauri build --target x86_64-unknown-linux-gnu --bundles rpm
      - name: Stage installer
        env:
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT" == workflow_dispatch ]]; then args+=(--dry-run); fi
          python3 scripts/packaging/release.py collect rpm target/x86_64-unknown-linux-gnu/release/bundle/rpm installers "${args[@]}"
      - name: Inspect and launch extracted RPM under Xvfb
        run: |
          set -euo pipefail
          rpm -qp --qf '%{NAME} %{VERSION} %{ARCH}\n' installers/*.rpm
          test "$(rpm -qp --qf '%{ARCH}' installers/*.rpm)" = x86_64
          test "$(rpm -qp --qf '%{VERSION}' installers/*.rpm)" = "$(python3 scripts/packaging/release.py version)"
          mkdir extracted
          rpm2cpio installers/*.rpm | (cd extracted && cpio -idm)
          xvfb-run -a dbus-run-session -- python3 scripts/packaging/launch.py extracted/usr/bin/meshdrop-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-installer
          path: installers/*.rpm
          if-no-files-found: error

  macos:
    needs: [ci, metadata]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo install tauri-cli --locked --version 2.11.4
      - name: Build unsigned universal DMG only
        working-directory: crates/meshdrop-app
        run: cargo tauri build --target universal-apple-darwin --bundles dmg
      - name: Stage installer
        env:
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT" == workflow_dispatch ]]; then args+=(--dry-run); fi
          python3 scripts/packaging/release.py collect dmg target/universal-apple-darwin/release/bundle/dmg installers "${args[@]}"
      - name: Mount DMG and launch packaged app
        run: |
          set -euo pipefail
          mountpoint="$(mktemp -d)"
          hdiutil attach installers/*.dmg -nobrowse -readonly -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          app="$mountpoint/meshdrop.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = org.meshdrop.desktop
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$(python3 scripts/packaging/release.py version)"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/meshdrop-app"
          python3 scripts/packaging/launch.py "$app/Contents/MacOS/meshdrop-app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-installer
          path: installers/*.dmg
          if-no-files-found: error

  android:
    needs: [ci, metadata]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: cargo install tauri-cli --locked --version 2.11.4
      - name: Build release signed arm64 APK
        env:
          MESHDROP_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MESHDROP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MESHDROP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MESHDROP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          source scripts/packaging/signing.sh
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cd crates/meshdrop-app
          cargo tauri android build --apk --target aarch64
      - name: Stage and verify release APK
        env:
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT" == workflow_dispatch ]]; then args+=(--dry-run); fi
          python3 scripts/packaging/release.py collect apk crates/meshdrop-app/gen/android/app/build/outputs/apk installers "${args[@]}"
          bash scripts/packaging/check-apk.sh installers/*.apk
      - name: Record Android launch limitation
        run: echo 'ARM64 APK verified by aapt and apksigner. Hosted x86_64 Linux cannot run an ARM64 Android AVD; emulator install/launch acceptance is required separately.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-installer
          path: installers/*.apk
          if-no-files-found: error

  checksums:
    needs: [linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-installer'
          merge-multiple: true
          path: installers
      - run: python3 scripts/packaging/release.py checksums installers
      - run: cd installers && sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-installers
          path: installers/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ci, metadata, linux, macos, android, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-installers
          path: installers
      - name: Validate notes and publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/packaging/release.py metadata --tag "$TAG"
          (cd installers && sha256sum --check SHA256SUMS)
          # Upload into a draft first so an upload failure cannot publish an incomplete release.
          created=false
          trap 'if [[ "$created" == true ]]; then gh release delete "$TAG" --yes; fi' ERR
          gh release create "$TAG" --draft --verify-tag --title "meshdrop $TAG" --notes-file release-notes.md
          created=true
          gh release upload "$TAG" installers/*
          gh release edit "$TAG" --draft=false
          created=false
